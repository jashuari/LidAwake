name: Build and release

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build universal release archives
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            ./scripts/release.sh "$GITHUB_REF_NAME"
          else
            ./scripts/release.sh
          fi
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LidAwake-universal-macos
          path: |
            dist/*.zip
            dist/*.dmg
            dist/SHA256SUMS.txt
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: LidAwake-universal-macos
          path: dist
      - name: Publish tagged release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag --title "LidAwake $GITHUB_REF_NAME" --generate-notes \
            dist/*.zip dist/*.dmg dist/SHA256SUMS.txt
